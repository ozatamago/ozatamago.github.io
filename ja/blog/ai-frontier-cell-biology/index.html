  <script type="module">
    import { open } from "/assets/seal.js";

    const ENC_URL = "content.enc";
    const PW_KEY = "seal:pw:/ja/blog/ai-frontier-cell-biology/";
    const gate = document.getElementById("lock-gate");
    const loading = document.getElementById("lock-loading");
    const bodyEl = document.getElementById("article-body");
    const errEl = document.getElementById("lock-err");
    const td = new TextDecoder();

    async function fetchBytes(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      return new Uint8Array(await response.arrayBuffer());
    }

    function showGate() {
      loading.hidden = true;
      gate.hidden = false;
      const input = document.getElementById("lock-pw");
      if (input) input.focus();
    }

    async function typesetMath() {
      if (window.MathJax && window.MathJax.startup && window.MathJax.startup.promise) {
        await window.MathJax.startup.promise;
        await window.MathJax.typesetPromise([bodyEl]);
      }
    }

    async function reveal(password, persist) {
      const bundle = await open(await fetchBytes(ENC_URL), password);
      const content = bundle.files.get("content.html");
      if (!content) throw new Error("MISSING_CONTENT");
      bodyEl.innerHTML = td.decode(content.bytes);
      for (const image of bodyEl.querySelectorAll("img[src]")) {
        const file = bundle.files.get(image.getAttribute("src"));
        if (file) {
          image.src = URL.createObjectURL(new Blob([file.bytes], { type: file.mime }));
        }
      }
      bodyEl.hidden = false;
      gate.hidden = true;
      loading.hidden = true;
      await typesetMath();
      if (persist) {
        try { localStorage.setItem(PW_KEY, password); } catch (e) {}
      }
    }

    function showError(error) {
      errEl.textContent =
        error && error.message === "BAD_PASSWORD" ? "パスワードが違います。" :
        error && error.message === "SECURE_CONTEXT" ? "復号にはhttpsまたはlocalhostでの閲覧が必要です。" :
        "読み込みに失敗しました（" + (error && error.message) + "）。";
      errEl.hidden = false;
    }

    if (!(window.isSecureContext && window.crypto && crypto.subtle)) {
      showGate();
      gate.querySelector("form").hidden = true;
      showError(new Error("SECURE_CONTEXT"));
    } else {
      let cached = null;
      try { cached = localStorage.getItem(PW_KEY); } catch (e) {}
      if (cached) {
        reveal(cached, false).catch(() => {
          try { localStorage.removeItem(PW_KEY); } catch (e) {}
          showGate();
        });
      } else {
        showGate();
      }
      document.getElementById("lock-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        errEl.hidden = true;
        const password = document.getElementById("lock-pw").value;
        const persist = document.getElementById("lock-remember").checked;
        try {
          await reveal(password, persist);
        } catch (error) {
          showError(error);
        }
      });
    }
  </script>
